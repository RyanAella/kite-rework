name: GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy all assets to public
        run: |
          mkdir -p public
          # Copy entire app directory
          cp -r ./app/* public/
          # Copy root assets (images, etc.)
          if [ -d ./assets ]; then cp -r ./assets/* public/; fi
          # Copy root files
          if [ -f ./style.css ]; then cp ./style.css public/; fi
          if [ -d ./server/public ]; then cp -r ./server/public/* public/; fi

      - name: Verify files
        run: |
          ls -R public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
